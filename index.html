<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #0f172a 100%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;
    padding: 20px;
  }

  .game-wrap {
    background: rgba(30, 41, 59, 0.65);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 20px;
    padding: 24px 28px 28px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    max-width: 620px;
    width: 100%;
    backdrop-filter: blur(6px);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .scores { display: flex; gap: 12px; }

  .score-box {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 10px;
    padding: 6px 14px;
    text-align: center;
    min-width: 76px;
  }

  .score-box .label { font-size: 11px; color: #94a3b8; letter-spacing: 1px; }
  .score-box .value { font-size: 20px; font-weight: 700; color: #f8fafc; }
  .score-box.high .value { color: #fbbf24; }

  .board-wrap {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 2px solid rgba(148, 163, 184, 0.25);
    background: #0b1220;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(11, 18, 32, 0.82);
    transition: opacity 0.25s ease;
    text-align: center;
    padding: 20px;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay .title { font-size: 26px; font-weight: 800; letter-spacing: 2px; }
  .overlay .sub { font-size: 14px; color: #94a3b8; line-height: 1.7; }
  .overlay .score { font-size: 15px; color: #fbbf24; font-weight: 600; }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #0f172a;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    transition: transform 0.12s ease, filter 0.12s ease;
    font-family: inherit;
  }

  button:hover { transform: translateY(-2px); filter: brightness(1.08); }
  button:active { transform: translateY(0); }

  button.secondary {
    background: rgba(148, 163, 184, 0.15);
    color: #e2e8f0;
    border: 1px solid rgba(148, 163, 184, 0.3);
  }

  .hint {
    margin-top: 14px;
    text-align: center;
    font-size: 12.5px;
    color: #64748b;
    line-height: 1.8;
  }

  .hint kbd {
    background: rgba(148, 163, 184, 0.15);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 11px;
    font-family: inherit;
  }
</style>
</head>
<body>

<div class="game-wrap">
  <div class="header">
    <h1>🐍 贪吃蛇</h1>
    <div class="scores">
      <div class="score-box">
        <div class="label">得分</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box high">
        <div class="label">最高分</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="game" width="500" height="500"></canvas>
    <div class="overlay" id="overlay">
      <div class="title" id="overlayTitle">🐍 贪吃蛇</div>
      <div class="sub" id="overlaySub">按「开始」或方向键开始游戏</div>
    </div>
  </div>

  <div class="controls">
    <button id="btnStart">开始</button>
    <button id="btnPause" class="secondary">暂停</button>
    <button id="btnRestart" class="secondary">重新开始</button>
  </div>

  <div class="hint">
    方向键 / WASD 控制移动 · 空格键暂停<br>
    手机端可直接在屏幕上滑动
  </div>
</div>

<script>
(() => {
  "use strict";

  const GRID = 20;            // 网格数（20 x 20）
  const CELL = 25;            // 单格像素
  const BEST_KEY = "snake_best_score";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlaySub = document.getElementById("overlaySub");
  const btnStart = document.getElementById("btnStart");
  const btnPause = document.getElementById("btnPause");
  const btnRestart = document.getElementById("btnRestart");

  let snake, dir, nextDir, food, score, best, state, timer, speed;

  // state: "ready" | "running" | "paused" | "over"
  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1,  y: 0 },
  };
  const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

  function init() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = DIRS.right;
    nextDir = dir;
    score = 0;
    speed = 160;
    best = Number(localStorage.getItem(BEST_KEY) || 0);
    bestEl.textContent = best;
    scoreEl.textContent = score;
    placeFood();
    draw();
  }

  function placeFood() {
    while (true) {
      const p = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID),
      };
      if (!snake.some(s => s.x === p.x && s.y === p.y)) {
        food = p;
        return;
      }
    }
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      return gameOver();
    }
    // 撞自己（尾部即将移开时不算撞）
    const willEat = head.x === food.x && head.y === food.y;
    if (snake.some((s, i) => s.x === head.x && s.y === head.y &&
        (willEat ? i < snake.length - 1 : true))) {
      return gameOver();
    }

    snake.unshift(head);

    if (willEat) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem(BEST_KEY, String(best));
      }
      placeFood();
      speed = Math.max(70, speed - 5);   // 越吃越快
      clearInterval(timer);
      timer = setInterval(tick, speed);
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 网格底纹
    ctx.fillStyle = "#0b1220";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "rgba(148, 163, 184, 0.06)";
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // 食物（苹果，带光晕）
    const fx = food.x * CELL, fy = food.y * CELL;
    const glow = ctx.createRadialGradient(fx + CELL / 2, fy + CELL / 2, 2, fx + CELL / 2, fy + CELL / 2, CELL * 0.9);
    glow.addColorStop(0, "rgba(248, 113, 113, 0.55)");
    glow.addColorStop(1, "rgba(248, 113, 113, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(fx + CELL / 2, fy + CELL / 2, CELL * 0.9, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(fx + CELL / 2, fy + CELL / 2, CELL * 0.34, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.65)";
    ctx.beginPath();
    ctx.arc(fx + CELL * 0.36, fy + CELL * 0.36, CELL * 0.09, 0, Math.PI * 2);
    ctx.fill();

    // 蛇身（渐变）
    snake.forEach((seg, i) => {
      const t = i / Math.max(1, snake.length - 1);
      const r = Math.round(74 + t * 30);
      const g = Math.round(222 - t * 30);
      const b = Math.round(128 - t * 40);
      ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.beginPath();
      ctx.roundRect(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4, 5);
      ctx.fill();
    });

    // 蛇头（高亮）
    const h = snake[0];
    ctx.fillStyle = "#22d3ee";
    ctx.beginPath();
    ctx.roundRect(h.x * CELL + 2, h.y * CELL + 2, CELL - 4, CELL - 4, 5);
    ctx.fill();

    // 眼睛
    let ex = h.x * CELL + CELL / 2 + dir.x * 4;
    let ey = h.y * CELL + CELL / 2 + dir.y * 4;
    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.arc(ex - 4, ey, 2.6, 0, Math.PI * 2);
    ctx.arc(ex + 4, ey, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function setState(s) {
    state = s;
    if (s === "running") {
      btnStart.textContent = "继续";
      btnStart.style.display = "none";
      btnPause.style.display = "inline-block";
      overlay.classList.add("hidden");
    } else if (s === "paused") {
      btnStart.style.display = "inline-block";
      btnStart.textContent = "继续";
    } else if (s === "ready") {
      btnStart.textContent = "开始";
      btnStart.style.display = "inline-block";
      overlayTitle.textContent = "🐍 贪吃蛇";
      overlaySub.textContent = "按「开始」或方向键开始游戏";
      overlay.classList.remove("hidden");
    } else if (s === "over") {
      btnStart.style.display = "inline-block";
      btnStart.textContent = "再来一局";
      overlayTitle.textContent = "💀 游戏结束";
      overlaySub.innerHTML = `得分 <b>${score}</b>${score >= best && score > 0 ? " · 🏆 新纪录！" : ""}`;
      overlay.classList.remove("hidden");
    }
  }

  function start() {
    if (state === "running") return;
    if (state === "over") init();
    if (state === "ready" && snake.length === 0) init();
    clearInterval(timer);
    timer = setInterval(tick, speed);
    setState("running");
  }

  function pause() {
    if (state !== "running") return;
    clearInterval(timer);
    setState("paused");
    overlayTitle.textContent = "⏸ 已暂停";
    overlaySub.textContent = "按「继续」或方向键继续";
    overlay.classList.remove("hidden");
  }

  function restart() {
    clearInterval(timer);
    init();
    setState("ready");
  }

  function gameOver() {
    clearInterval(timer);
    setState("over");
  }

  function setDir(name) {
    const d = DIRS[name];
    if (!d) return;
    if (state === "ready") return start();
    if (state === "over") return;
    if (state === "paused") {
      start();
      return;
    }
    // 不允许 180° 反向
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  // 键盘控制
  const KEYMAP = {
    ArrowUp: "up", KeyW: "up", W: "up", w: "up",
    ArrowDown: "down", KeyS: "down", S: "down", s: "down",
    ArrowLeft: "left", KeyA: "left", A: "left", a: "left",
    ArrowRight: "right", KeyD: "right", D: "right", d: "right",
    Space: "space",
  };
  document.addEventListener("keydown", (e) => {
    const action = KEYMAP[e.code];
    if (!action) return;
    e.preventDefault();
    if (action === "space") {
      state === "running" ? pause() : start();
      return;
    }
    setDir(action);
  });

  // 触屏滑动
  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;  // 忽略轻微滑动
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? "right" : "left");
    else setDir(dy > 0 ? "down" : "up");
  });

  btnStart.addEventListener("click", start);
  btnPause.addEventListener("click", pause);
  btnRestart.addEventListener("click", restart);

  init();
  setState("ready");
})();
</script>
</body>
</html>
