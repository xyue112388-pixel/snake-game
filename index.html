<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #0f172a 100%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;
    padding: 20px;
  }

  .game-wrap {
    background: rgba(30, 41, 59, 0.65);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 20px;
    padding: 24px 28px 28px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    max-width: 620px;
    width: 100%;
    backdrop-filter: blur(6px);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .scores { display: flex; gap: 12px; }

  .score-box {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 10px;
    padding: 6px 14px;
    text-align: center;
    min-width: 76px;
  }

  .score-box .label { font-size: 11px; color: #94a3b8; letter-spacing: 1px; }
  .score-box .value { font-size: 20px; font-weight: 700; color: #f8fafc; }
  .score-box.high .value { color: #fbbf24; }

  .board-wrap {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 2px solid rgba(148, 163, 184, 0.25);
    background: #0b1220;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(11, 18, 32, 0.82);
    transition: opacity 0.25s ease;
    text-align: center;
    padding: 20px;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay .title { font-size: 26px; font-weight: 800; letter-spacing: 2px; }
  .overlay .sub { font-size: 14px; color: #94a3b8; line-height: 1.7; }
  .overlay .score { font-size: 15px; color: #fbbf24; font-weight: 600; }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #0f172a;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    transition: transform 0.12s ease, filter 0.12s ease;
    font-family: inherit;
  }

  button:hover { transform: translateY(-2px); filter: brightness(1.08); }
  button:active { transform: translateY(0); }

  button.secondary {
    background: rgba(148, 163, 184, 0.15);
    color: #e2e8f0;
    border: 1px solid rgba(148, 163, 184, 0.3);
  }

  .hint {
    margin-top: 14px;
    text-align: center;
    font-size: 12.5px;
    color: #64748b;
    line-height: 1.8;
  }

  .hint kbd {
    background: rgba(148, 163, 184, 0.15);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 11px;
    font-family: inherit;
  }
</style>
</head>
<body>

<div class="game-wrap">
  <div class="header">
    <h1>🐍 贪吃蛇</h1>
    <div class="scores">
      <div class="score-box">
        <div class="label">得分</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box high">
        <div class="label">最高分</div>
        <div class="value" id="best">0</div>
      </div>
      <div class="score-box" id="bonusBox" style="display:none">
        <div class="label">⚡ 双倍得分</div>
        <div class="value" id="bonusTime">0</div>
      </div>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="game" width="500" height="500"></canvas>
    <div class="overlay" id="overlay">
      <div class="title" id="overlayTitle">🐍 贪吃蛇</div>
      <div class="sub" id="overlaySub">按「开始」或方向键开始游戏</div>
    </div>
  </div>

  <div class="controls">
    <button id="btnStart">开始</button>
    <button id="btnPause" class="secondary">暂停</button>
    <button id="btnRestart" class="secondary">重新开始</button>
  </div>

  <div class="hint">
    方向键 / WASD 控制移动 · 空格键暂停<br>
    手机端可直接在屏幕上滑动
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
